<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compression Ratio</title>
<link rel="stylesheet" href="kit.css">
</head>
<body>
<header class="top"><span id="pill" class="pill">CR 10 : 1</span><span id="read" class="read mono"></span></header>
<canvas id="c" aria-label="A piston squeezing gas, with a pressure gauge"></canvas>
<div class="stats">
  <div class="stat"><b id="vc" class="mono"></b><span>Squeeze space left at the top (Vc)</span></div>
  <div class="stat"><b class="mono">500 cc</b><span>Space the piston sweeps (Vs)</span></div>
  <div class="stat"><b id="pk" class="mono"></b><span>Squeeze pressure at the top</span></div>
  <div class="stat"><b id="tk" class="mono"></b><span>Squeeze temperature at the top</span></div>
  <div class="stat" style="grid-column: span 2"><b id="fuel"></b><span>Rough guide for petrol engines</span></div>
</div>
<div class="controls">
  <button id="play" class="btn primary"></button>
  <label class="slider">Ratio <input id="cr" type="range" min="6" max="14" step="0.5" value="10"><span id="crv" class="mono">10</span></label>
</div>
<script src="kit.js"></script>
<script>
// CR = (Vs + Vc) / Vc. Pressure and temperature use the squeeze-without-burning rule of thumb:
// P = 1 bar x CR^1.3 and T = 300 K x CR^0.3 (no fuel burning yet, just squeezing).
const { C, stage, mix, alpha, rr, txt, playButton } = Kit;
const W = 360, H = 320, VS = 500, S = 200, TOPY = 24, L = 70, R = 200;
let cr = +(Kit.P.get('cr') || 10), playing = true, t = 0;
const dots = Array.from({ length: 70 }, () => ({ u: Math.random(), v: Math.random(), du: Math.random() - 0.5, dv: Math.random() - 0.5 }));

const vc = () => VS / (cr - 1);
const pressure = ratio => Math.pow(ratio, 1.3);
const tempC = ratio => 300 * Math.pow(ratio, 0.3) - 273;

function draw(ctx, dt) {
  if (playing) t += dt;
  const x = (1 + Math.cos(t * Math.PI / 2)) / 2;     // 1 = bottom, 0 = top; one squeeze every 4 s
  const c = S / (cr - 1);
  const top = TOPY + c + x * S;
  const ratioNow = (VS + vc()) / (vc() + x * VS);
  const p = pressure(ratioNow), heat = Math.min(1, (tempC(ratioNow) - 27) / 450);

  // Cylinder and chamber gas.
  ctx.fillStyle = alpha(mix(C.intake, C.power, heat), 0.22);
  ctx.fillRect(L, TOPY, R - L, top - TOPY);
  const speed = 0.25 + heat;
  for (const d of dots) {
    if (playing) {
      d.u += d.du * dt * speed; d.v += d.dv * dt * speed * 2.2;
      if (d.u < 0 || d.u > 1) { d.du *= -1; d.u = Math.max(0, Math.min(1, d.u)); }
      if (d.v < 0 || d.v > 1) { d.dv *= -1; d.v = Math.max(0, Math.min(1, d.v)); }
    }
    ctx.fillStyle = mix(C.intake, C.power, heat);
    ctx.beginPath(); ctx.arc(L + 5 + d.u * (R - L - 10), TOPY + 4 + d.v * (top - TOPY - 8), 2.6, 0, 7); ctx.fill();
  }
  ctx.fillStyle = C.metal; ctx.strokeStyle = C.ink; ctx.lineWidth = 1.2;
  ctx.fillRect(L - 10, TOPY - 10, R - L + 20, 10); ctx.strokeRect(L - 10, TOPY - 10, R - L + 20, 10);
  ctx.fillRect(L - 10, TOPY, 10, 276); ctx.strokeRect(L - 10, TOPY, 10, 276);
  ctx.fillRect(R, TOPY, 10, 276); ctx.strokeRect(R, TOPY, 10, 276);
  rr(ctx, L + 1, top, R - L - 2, 28, 3); ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.metal2; ctx.fillRect((L + R) / 2 - 6, top + 28, 12, 40);

  // Brackets: clearance volume (Vc) and swept volume (Vs).
  const bracket = (y1, y2, name, color) => {
    ctx.strokeStyle = color; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(44, y1); ctx.lineTo(38, y1); ctx.lineTo(38, y2); ctx.lineTo(44, y2); ctx.stroke();
    txt(ctx, name, 32, (y1 + y2) / 2, { align: 'right', size: 11, weight: 700, color });
  };
  bracket(TOPY, TOPY + c, 'Vc', C.power);
  bracket(TOPY + c, TOPY + c + S, 'Vs', C.intake);
  ctx.setLineDash([4, 4]); ctx.strokeStyle = C.muted; ctx.lineWidth = 1;
  for (const y of [TOPY + c, TOPY + c + S]) { ctx.beginPath(); ctx.moveTo(44, y); ctx.lineTo(L - 12, y); ctx.stroke(); }
  ctx.setLineDash([]);

  // Pressure gauge.
  const gx = 262, gw = 30, gy = 30, gh = 260, max = 32;
  txt(ctx, 'Pressure', gx + gw / 2, 14, { align: 'center', size: 11, weight: 700 });
  ctx.fillStyle = C.panel; ctx.strokeStyle = C.ink; rr(ctx, gx, gy, gw, gh, 8); ctx.fill(); ctx.stroke();
  const fh = Math.min(1, p / max) * gh;
  ctx.fillStyle = mix(C.intake, C.power, heat); rr(ctx, gx + 3, gy + gh - fh, gw - 6, Math.max(6, fh - 3), 5); ctx.fill();
  for (let b = 0; b <= 30; b += 10) {
    const y = gy + gh - b / max * gh;
    ctx.strokeStyle = C.muted; ctx.beginPath(); ctx.moveTo(gx + gw, y); ctx.lineTo(gx + gw + 6, y); ctx.stroke();
    txt(ctx, `${b}`, gx + gw + 9, y, { size: 10, color: C.muted, mono: true });
  }
  txt(ctx, `${p.toFixed(1)} bar`, gx + gw / 2, gy + gh + 16, { align: 'center', size: 11, weight: 700, mono: true });

  read.textContent = `now squeezed ${ratioNow.toFixed(1)}×`;
}

const $ = id => document.getElementById(id);
const read = $('read');
function update() {
  $('pill').textContent = `CR ${cr} : 1`;
  $('crv').textContent = cr;
  $('vc').textContent = `${vc().toFixed(0)} cc`;
  $('pk').textContent = `≈ ${pressure(cr).toFixed(0)} bar`;
  $('tk').textContent = `≈ ${tempC(cr).toFixed(0)} °C`;
  $('fuel').textContent = cr <= 10 ? '✅ Regular fuel is fine' : cr <= 12 ? '⚠️ Needs premium (higher octane) fuel' : '🔥 Knock risk: needs very high octane or direct injection';
}
stage($('c'), W, H, draw);
$('cr').value = cr;
$('cr').oninput = e => { cr = +e.target.value; update(); };
const play = $('play');
playButton(play, playing);
play.onclick = () => { playing = !playing; playButton(play, playing); };
update();
</script>
</body>
</html>
