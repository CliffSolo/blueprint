<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4-Stroke Engine</title>
<link rel="stylesheet" href="kit.css">
</head>
<body>
<header class="top"><span id="pill" class="pill">Intake</span><span id="read" class="read mono"></span></header>
<canvas id="c" aria-label="Animated cutaway of a single-cylinder four-stroke engine"></canvas>
<p id="explain" class="explain" hidden></p>
<div class="controls" id="ctl-full">
  <button id="play" class="btn primary"></button>
  <button id="restart" class="btn" aria-label="Restart">↺</button>
  <label class="slider">Speed <input id="speed" type="range" min="0.25" max="4" step="0.25" value="1"><span id="sv" class="mono">1×</span></label>
  <button id="lbl" class="btn small">Labels</button>
</div>
<div class="controls" id="ctl-step" hidden>
  <button id="back" class="btn">◀&#xFE0E; Back</button>
  <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
  <button id="next" class="btn primary">Start ▶&#xFE0E;</button>
</div>
<script src="kit.js"></script>
<script>
// Modes: ?mode=full (plays forever) | ?mode=step (one stroke per tap). ?labels=0 hides part names.
const { P, C, stage, mix, alpha, rr, txt, label, playButton } = Kit;
const MODE = P.get('mode') === 'step' ? 'step' : 'full';
let showLabels = P.get('labels') !== '0';

const STROKES = [
  { name: 'Intake', color: C.intake, nick: 'Suck',
    text: '<b>Piston moves down. Intake valve open.</b> The falling piston leaves low pressure behind it, so air and fuel rush in to fill the space.' },
  { name: 'Compression', color: C.comp, nick: 'Squeeze',
    text: '<b>Piston moves up. Both valves closed.</b> The mix gets squeezed into about a tenth of the space. Squeezed mix burns hotter and pushes harder.' },
  { name: 'Power', color: C.power, nick: 'Bang',
    text: '<b>Spark fires just before the top.</b> The mix burns in a flash, pressure spikes, and it shoves the piston down hard. This is the only stroke that makes power.' },
  { name: 'Exhaust', color: C.exhaust, nick: 'Blow',
    text: '<b>Piston moves up. Exhaust valve open.</b> The rising piston pushes the burnt gas out the exhaust. Then the whole cycle starts again.' },
];

// Geometry in design units (360 x 340).
const W = 360, H = 340;
const cx = 180, cy = 250, r = 34, L = 96, headY = 86, boreL = 142, boreR = 218;
const pistonH = 34, pinOff = 20, maxLift = 10;
const IN_X = 162, EX_X = 198;
const IN_RUN = [[IN_X, headY - 2], [150, 62], [98, 62]];
const EX_RUN = [[EX_X, headY - 2], [210, 62], [262, 62]];

let theta = 0;              // cycle angle, 0..720 (0 = top dead centre at the start of intake)
let playing = MODE === 'full';
let speed = 1, target = null, step = -1, flow = 0;
const BASE = 90;            // degrees per second at 1x: one full cycle every 8 s

const intakeLift = th => th < 180 ? Math.sin(Math.PI * th / 180) : 0;
const exhaustLift = th => th >= 540 ? Math.sin(Math.PI * (th - 540) / 180) : 0;
const strokeAt = th => Math.min(3, Math.floor((th % 720) / 180));
const pinY = a => cy - (r * Math.cos(a) + Math.sqrt(L * L - (r * Math.sin(a)) ** 2));

function gasColor(th) {
  if (th < 180) return alpha(C.intake, 0.18 + 0.17 * th / 180);
  if (th < 360) return alpha(C.intake, 0.35 + 0.3 * (th - 180) / 180);
  if (th < 540) {
    const u = (th - 360) / 180;
    return u < 0.35 ? mix(C.fire, C.power, u / 0.35) : mix(C.power, C.exhaust, (u - 0.35) / 0.65);
  }
  return alpha(C.exhaust, 0.55 - 0.4 * (th - 540) / 180);
}

function pointOn(path, t) {
  const segs = [];
  let total = 0;
  for (let i = 1; i < path.length; i++) {
    const d = Math.hypot(path[i][0] - path[i - 1][0], path[i][1] - path[i - 1][1]);
    segs.push(d); total += d;
  }
  let d = t * total;
  for (let i = 0; i < segs.length; i++) {
    if (d <= segs[i]) {
      const k = d / segs[i];
      return [path[i][0] + (path[i + 1][0] - path[i][0]) * k, path[i][1] + (path[i + 1][1] - path[i][1]) * k];
    }
    d -= segs[i];
  }
  return path[path.length - 1];
}

function runner(ctx, path) {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const [w, c] of [[22, C.metal2], [15, C.port]]) {
    ctx.strokeStyle = c; ctx.lineWidth = w;
    ctx.beginPath(); path.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
  }
}

function flowDots(ctx, path, color, amount, outward) {
  if (amount < 0.05) return;
  ctx.fillStyle = color;
  for (let k = 0; k < 7; k++) {
    let t = (k / 7 + flow * 0.9) % 1;
    if (!outward) t = 1 - t;          // intake flows from the pipe end toward the valve
    const [x, y] = pointOn(path, t);
    ctx.globalAlpha = Math.min(1, amount * 1.4);
    ctx.beginPath(); ctx.arc(x, y, 2.6, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function valve(ctx, x, lift, tint) {
  const y = headY + lift * maxLift;
  ctx.strokeStyle = C.metal2; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(x, 40); ctx.lineTo(x, y - 4); ctx.stroke();
  ctx.fillStyle = C.ink; ctx.fillRect(x - 5, 38, 10, 3);      // spring retainer
  ctx.beginPath();
  ctx.moveTo(x - 12, y); ctx.lineTo(x + 12, y); ctx.lineTo(x + 4, y - 5); ctx.lineTo(x - 4, y - 5); ctx.closePath();
  ctx.fillStyle = mix(C.metal2, tint, 0.45 + 0.55 * lift); ctx.fill();
  ctx.strokeStyle = C.ink; ctx.lineWidth = 1; ctx.stroke();
}

function sparkPlug(ctx, th) {
  ctx.fillStyle = C.ink; rr(ctx, 172, 18, 16, 12, 2); ctx.fill();
  ctx.fillStyle = C.panel; ctx.strokeStyle = C.ink; ctx.lineWidth = 1;
  rr(ctx, 174, 30, 12, 16, 3); ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.metal2; ctx.fillRect(176, 46, 8, headY - 46);
  ctx.fillStyle = C.ink; ctx.fillRect(179, headY, 2, 4);
  const sparkOn = th >= 346 && th < 368;
  if (sparkOn) {
    const k = 1 - Math.abs(th - 355) / 13;
    const g = ctx.createRadialGradient(180, headY + 5, 0, 180, headY + 5, 30);
    g.addColorStop(0, alpha(C.fire, 0.9 * k)); g.addColorStop(1, alpha(C.fire, 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(180, headY + 5, 30, 0, 7); ctx.fill();
    ctx.strokeStyle = C.fire; ctx.lineWidth = 2;
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4 + th / 20;
      ctx.beginPath();
      ctx.moveTo(180 + Math.cos(a) * 4, headY + 5 + Math.sin(a) * 4);
      ctx.lineTo(180 + Math.cos(a) * (9 + 6 * k), headY + 5 + Math.sin(a) * (9 + 6 * k));
      ctx.stroke();
    }
  }
}

function cycleBar(ctx, th) {
  const x0 = 24, w = 312, y = 304;
  STROKES.forEach((s, i) => {
    ctx.fillStyle = alpha(s.color, strokeAt(th) === i ? 1 : 0.35);
    rr(ctx, x0 + i * w / 4 + 1, y, w / 4 - 2, 10, 3); ctx.fill();
    txt(ctx, s.name, x0 + i * w / 4 + w / 8, y + 22, { align: 'center', size: 10, weight: strokeAt(th) === i ? 700 : 500,
      color: strokeAt(th) === i ? C.ink : C.muted });
  });
  txt(ctx, 'Crank turn 1', x0 + w / 4, y - 9, { align: 'center', size: 9, color: C.muted });
  txt(ctx, 'Crank turn 2', x0 + 3 * w / 4, y - 9, { align: 'center', size: 9, color: C.muted });
  ctx.strokeStyle = C.line; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x0 + w / 2, y - 14); ctx.lineTo(x0 + w / 2, y + 12); ctx.stroke();
  const mx = x0 + (th % 720) / 720 * w;
  ctx.fillStyle = C.ink;
  ctx.beginPath(); ctx.moveTo(mx, y + 11); ctx.lineTo(mx - 5, y + 18); ctx.lineTo(mx + 5, y + 18); ctx.closePath(); ctx.fill();
  ctx.fillRect(mx - 1, y - 3, 2, 16);
}

function draw(ctx, dt) {
  if (MODE === 'full' && playing) theta = (theta + BASE * speed * dt) % 720;
  if (MODE === 'step' && target !== null) {
    theta = Math.min(target, theta + BASE * 1.25 * dt);
    if (theta >= target) { target = null; }
  }
  // In step mode, hold the label on the stroke just played (its end angle is the next stroke's start).
  const th = MODE === 'step' && step >= 0 ? Math.min(theta, (step + 1) * 180 - 0.01) : (theta >= 720 ? 719.999 : theta);
  const moving = (MODE === 'full' && playing) || target !== null;
  if (moving) flow += dt * speed;

  const a = (th % 360) * Math.PI / 180;
  const py = pinY(a);
  const top = py - pinOff;
  const crankX = cx + r * Math.sin(a), crankY = cy - r * Math.cos(a);
  const il = intakeLift(th), el = exhaustLift(th);

  // Cylinder head block, then the intake and exhaust runners cut through it.
  ctx.fillStyle = C.metal; ctx.strokeStyle = C.ink; ctx.lineWidth = 1.2;
  rr(ctx, 118, 34, 124, headY - 34, 6); ctx.fill(); ctx.stroke();
  runner(ctx, IN_RUN); runner(ctx, EX_RUN);
  flowDots(ctx, IN_RUN, C.intake, il, false);
  flowDots(ctx, EX_RUN, C.exhaust, el, true);

  // Crankcase.
  ctx.fillStyle = alpha(C.metal, 0.55); ctx.strokeStyle = C.line;
  rr(ctx, 112, 204, 136, 84, 18); ctx.fill(); ctx.stroke();

  // Gas in the combustion chamber.
  ctx.fillStyle = gasColor(th);
  ctx.fillRect(boreL, headY, boreR - boreL, top - headY);

  // Cylinder walls.
  ctx.fillStyle = C.metal;
  ctx.fillRect(boreL - 10, headY, 10, 122); ctx.fillRect(boreR, headY, 10, 122);
  ctx.strokeStyle = C.ink; ctx.lineWidth = 1.2;
  ctx.strokeRect(boreL - 10, headY, 10, 122); ctx.strokeRect(boreR, headY, 10, 122);

  // Crank: counterweight, web, main journal.
  ctx.fillStyle = C.metal2;
  ctx.beginPath(); ctx.moveTo(cx, cy);
  ctx.arc(cx, cy, 40, a + Math.PI / 2 + 0.5, a + Math.PI * 1.5 - 0.5); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = C.metal2; ctx.lineWidth = 18; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(crankX, crankY); ctx.stroke();
  ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(cx, cy, 6, 0, 7); ctx.fill();

  // Connecting rod and piston.
  ctx.strokeStyle = C.ink; ctx.lineWidth = 11;
  ctx.beginPath(); ctx.moveTo(cx, py); ctx.lineTo(crankX, crankY); ctx.stroke();
  ctx.strokeStyle = C.metal; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.moveTo(cx, py); ctx.lineTo(crankX, crankY); ctx.stroke();
  ctx.fillStyle = C.metal; ctx.strokeStyle = C.ink; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(crankX, crankY, 9, 0, 7); ctx.fill(); ctx.stroke();
  rr(ctx, boreL + 1, top, boreR - boreL - 2, pistonH, 3); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = C.metal2; ctx.lineWidth = 1.5;
  for (const dy of [6, 11]) { ctx.beginPath(); ctx.moveTo(boreL + 1, top + dy); ctx.lineTo(boreR - 1, top + dy); ctx.stroke(); }
  ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(cx, py, 4.5, 0, 7); ctx.fill();

  valve(ctx, IN_X, il, C.intake);
  valve(ctx, EX_X, el, C.exhaust);
  sparkPlug(ctx, th);

  if (showLabels) {
    label(ctx, 'Intake', 104, 54, 100, 26, 'right');
    label(ctx, 'Exhaust', 256, 54, 260, 26);
    label(ctx, 'Spark plug', 188, 24, 262, 8 + 2);
    label(ctx, 'Intake valve', IN_X - 10, headY + il * maxLift - 2, 104, 104, 'right');
    label(ctx, 'Exhaust valve', EX_X + 10, headY + el * maxLift - 2, 256, 104);
    label(ctx, 'Piston', boreL + 6, top + pistonH / 2, 104, 150, 'right');
    label(ctx, 'Cylinder', boreL - 8, 196, 104, 196, 'right');
    label(ctx, 'Connecting rod', (cx + crankX) / 2 + 4, (py + crankY) / 2, 256, 190);
    label(ctx, 'Crankshaft', cx + 8, cy + 4, 256, 268);
  }
  cycleBar(ctx, th);

  const s = STROKES[strokeAt(th)];
  pill.textContent = `${s.name} · ${s.nick}`;
  pill.style.background = s.color;
  read.textContent = `Crank ${Math.floor(th % 360)}° · turn ${th < 360 ? 1 : 2} of 2`;
}

const $ = id => document.getElementById(id);
const pill = $('pill'), read = $('read');
stage($('c'), W, H, draw);

if (MODE === 'full') {
  const play = $('play');
  playButton(play, playing);
  play.onclick = () => { playing = !playing; playButton(play, playing); };
  $('restart').onclick = () => { theta = 0; playing = true; playButton(play, true); };
  $('speed').oninput = e => { speed = +e.target.value; $('sv').textContent = speed + '×'; };
  const lbl = $('lbl');
  lbl.classList.toggle('on', showLabels);
  lbl.onclick = () => { showLabels = !showLabels; lbl.classList.toggle('on', showLabels); };
} else {
  $('ctl-full').hidden = true;
  $('ctl-step').hidden = false;
  const explain = $('explain'), dots = [...$('dots').children], next = $('next');
  explain.hidden = false;
  explain.innerHTML = 'Piston at the very top. Tap <b>Start</b> to run the first stroke.';
  function show() {
    const s = STROKES[step];
    explain.innerHTML = s.text;
    explain.style.borderColor = s.color;
    dots.forEach((d, i) => { d.classList.toggle('on', i === step); d.style.background = i <= step ? STROKES[i].color : ''; });
    next.textContent = (step === 3 ? 'Again ' : 'Next ') + '▶' + Kit.NB;
  }
  next.onclick = () => {
    step = step >= 3 ? 0 : step + 1;
    theta = step * 180; target = (step + 1) * 180; show();
  };
  $('back').onclick = () => {
    if (step < 0) return;
    step = Math.max(0, step - 1);
    theta = step * 180; target = (step + 1) * 180; show();
  };
}
</script>
</body>
</html>
