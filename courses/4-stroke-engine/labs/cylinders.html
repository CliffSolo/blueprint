<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>More Cylinders</title>
<link rel="stylesheet" href="kit.css">
</head>
<body>
<header class="top"><span id="pill" class="pill">Firing order</span><span id="read" class="read mono"></span></header>
<canvas id="c" aria-label="One, two or four cylinders sharing a crankshaft, with a graph of the push on the crank"></canvas>
<div class="controls">
  <button id="play" class="btn primary"></button>
  <div class="seg" role="group" aria-label="Cylinders"><button data-n="1">1 cyl</button><button data-n="2">2 cyl</button><button data-n="4">4 cyl</button></div>
  <label class="slider">Speed <input id="speed" type="range" min="0.25" max="3" step="0.25" value="1"><span id="sv" class="mono">1×</span></label>
</div>
<script src="kit.js"></script>
<script>
// Each cylinder runs the same 720° cycle, shifted so their power strokes take turns.
// Inline-four offsets give the classic 1-3-4-2 firing order.
const { C, stage, alpha, mix, rr, txt, playButton } = Kit;
const W = 360, H = 330;
const LAYOUTS = {
  1: { offsets: [0], order: [1] },
  2: { offsets: [0, 360], order: [1, 2] },
  4: { offsets: [0, 540, 180, 360], order: [1, 3, 4, 2] },
};
const STROKE_COLORS = [C.intake, C.comp, C.power, C.exhaust];
const STROKE_NAMES = ['Intake', 'Compression', 'Power', 'Exhaust'];
let n = +(Kit.P.get('n') || 4), theta = 0, playing = true, speed = 1;

const norm = a => ((a % 720) + 720) % 720;
// Rough push one cylinder puts on the crank through its cycle (power is the only big positive part).
function torque(phi) {
  phi = norm(phi);
  const u = (phi % 180) / 180, s = Math.sin(Math.PI * u);
  if (phi < 180) return -0.08 * s;
  if (phi < 360) return -0.35 * s * (0.3 + u);
  if (phi < 540) return 1.6 * s * Math.pow(1 - u, 0.8);
  return -0.1 * s;
}
const total = th => LAYOUTS[n].offsets.reduce((sum, off) => sum + torque(th - off), 0);
function noPushShare() {
  let neg = 0;
  for (let a = 0; a < 720; a += 2) if (total(a) < 0) neg++;
  return Math.round(neg / 360 * 100);
}

function cylinder(ctx, x, bore, phi, num, firing) {
  const cy = 168, r = 18, L = 50, headY = 64;
  const a = (phi % 360) * Math.PI / 180;
  const py = cy - (r * Math.cos(a) + Math.sqrt(L * L - (r * Math.sin(a)) ** 2));
  const top = py - 12, stroke = Math.floor(phi / 180);
  // Chamber gas, walls, head.
  ctx.fillStyle = stroke === 2 ? mix(C.fire, C.power, (phi - 360) / 90) : alpha(STROKE_COLORS[stroke], 0.45);
  ctx.fillRect(x - bore / 2, headY, bore, top - headY);
  ctx.fillStyle = C.metal; ctx.strokeStyle = C.ink; ctx.lineWidth = 1;
  ctx.fillRect(x - bore / 2 - 5, headY, 5, 84); ctx.strokeRect(x - bore / 2 - 5, headY, 5, 84);
  ctx.fillRect(x + bore / 2, headY, 5, 84); ctx.strokeRect(x + bore / 2, headY, 5, 84);
  rr(ctx, x - bore / 2 - 5, headY - 14, bore + 10, 14, 3); ctx.fill(); ctx.stroke();
  // Valve lamps on the head: lit when that valve is open.
  ctx.fillStyle = stroke === 0 ? C.intake : C.panel; ctx.beginPath(); ctx.arc(x - bore / 4, headY - 7, 4, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = stroke === 3 ? C.exhaust : C.panel; ctx.beginPath(); ctx.arc(x + bore / 4, headY - 7, 4, 0, 7); ctx.fill(); ctx.stroke();
  // Rod, piston, crank throw.
  const px = x + r * Math.sin(a), pyc = cy - r * Math.cos(a);
  ctx.strokeStyle = C.metal2; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x, py); ctx.lineTo(px, pyc); ctx.stroke();
  ctx.lineWidth = 9; ctx.beginPath(); ctx.moveTo(x, cy); ctx.lineTo(px, pyc); ctx.stroke();
  ctx.fillStyle = C.metal; ctx.strokeStyle = C.ink; ctx.lineWidth = 1;
  rr(ctx, x - bore / 2 + 1, top, bore - 2, 22, 2); ctx.fill(); ctx.stroke();
  if (firing) {
    ctx.fillStyle = alpha(C.fire, 0.9);
    ctx.beginPath(); ctx.arc(x, headY + 4, 7, 0, 7); ctx.fill();
  }
  txt(ctx, `${num}`, x, headY - 24, { align: 'center', size: 13, weight: 800 });
  txt(ctx, STROKE_NAMES[stroke], x, 196, { align: 'center', size: 9, weight: 700, color: STROKE_COLORS[stroke] });
}

function graph(ctx, th) {
  const x0 = 20, x1 = 340, y0 = 222, h = 82, mid = y0 + h * 0.62, scale = h * 0.5;
  txt(ctx, 'Push on the crankshaft', x0, y0 - 6, { size: 11, weight: 700 });
  txt(ctx, `no push ${noPushShare()}% of the time`, x1, y0 - 6, { size: 10, color: C.muted, align: 'right', mono: true });
  ctx.fillStyle = C.panel; ctx.strokeStyle = C.line; rr(ctx, x0, y0, x1 - x0, h, 6); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = C.muted; ctx.setLineDash([3, 3]);
  ctx.beginPath(); ctx.moveTo(x0, mid); ctx.lineTo(x1, mid); ctx.stroke(); ctx.setLineDash([]);
  const pts = [];
  for (let i = 0; i <= 160; i++) {
    const a = th - 720 + i / 160 * 720;
    pts.push([x0 + i / 160 * (x1 - x0), mid - Math.max(-0.5, Math.min(1.3, total(a))) * scale]);
  }
  ctx.beginPath(); ctx.moveTo(x0, mid); pts.forEach(([x, y]) => ctx.lineTo(x, y)); ctx.lineTo(x1, mid); ctx.closePath();
  ctx.fillStyle = alpha(C.power, 0.25); ctx.fill();
  ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
  ctx.strokeStyle = C.power; ctx.lineWidth = 2; ctx.stroke();
  const [ex, ey] = pts[pts.length - 1];
  ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(ex, ey, 3.5, 0, 7); ctx.fill();
  txt(ctx, 'pushing', x0 + 4, y0 + 9, { size: 9, color: C.muted });
  txt(ctx, 'dragging', x0 + 4, y0 + h - 8, { size: 9, color: C.muted });
  txt(ctx, '← two crank turns ago', x0, y0 + h + 12, { size: 9, color: C.muted });
  txt(ctx, 'now', x1, y0 + h + 12, { size: 9, color: C.muted, align: 'right' });
}

function draw(ctx, dt) {
  if (playing) theta += 120 * speed * dt;
  const { offsets, order } = LAYOUTS[n];
  const slot = 300 / n, bore = Math.min(56, slot - 18);
  // Shared crankshaft line.
  ctx.strokeStyle = C.ink; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(30, 168); ctx.lineTo(330, 168); ctx.stroke();
  let firing = null;
  offsets.forEach((off, i) => {
    const phi = norm(theta - off);
    if (phi >= 360 && phi < 540) firing = i + 1;
    cylinder(ctx, 30 + slot * (i + 0.5), bore, phi, i + 1, phi >= 352 && phi < 380);
  });
  graph(ctx, theta);
  pill.textContent = `Firing order ${order.join(' – ')}`;
  read.textContent = firing ? `cylinder ${firing} on power` : 'no power stroke';
}

const $ = id => document.getElementById(id);
const pill = $('pill'), read = $('read');
stage($('c'), W, H, draw);
const segs = [...document.querySelectorAll('[data-n]')];
function pick(v) { n = v; segs.forEach(b => b.classList.toggle('on', +b.dataset.n === v)); }
segs.forEach(b => b.onclick = () => pick(+b.dataset.n));
pick(n);
const play = $('play');
playButton(play, playing);
play.onclick = () => { playing = !playing; playButton(play, playing); };
$('speed').oninput = e => { speed = +e.target.value; $('sv').textContent = speed + '×'; };
</script>
</body>
</html>
